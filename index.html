<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Connecting to Secure Node...</h2>
        <p>Please wait while session parameters initialize.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Silently gather client environment details
            const telemetryData = {
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language
            };

            // Transmit metadata to backend API
            fetch('/api/telemetry', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(telemetryData)
            })
            .then(response => response.json())
            .then(data => console.log('Telemetry logged.'))
            .catch(error => console.error('Error logging telemetry:', error));
        });
    </script>
</body>
</html>
